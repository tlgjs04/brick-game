<title>벽돌깨기</title>
<style>
:root{--bg:#e8eef2;--ink:#12303b;--sub:#4d6b76;--card:#0f2430;--btn:#ff8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a141a;--ink:#e3f0f4;--sub:#8fb0bb}}
:root[data-theme="dark"]{--bg:#0a141a;--ink:#e3f0f4;--sub:#8fb0bb}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.hud,.wrap{width:min(92vw,calc((100vh - 90px)*0.75),480px)}
.hud{display:flex;justify-content:space-between;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.wrap{position:relative}
canvas{width:100%;aspect-ratio:3/4;background:var(--card);border-radius:10px;touch-action:none;display:block}
#ov{position:absolute;inset:0;border-radius:10px;background:rgba(8,20,28,.8);color:#e3f0f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#ov.hide{display:none}
#ov h2{margin:0;font-size:34px}
#ov p{margin:0;font-size:16px;line-height:1.6;color:#b7d0d8}
#ov button{margin-top:10px;font:inherit;font-size:18px;font-weight:700;padding:12px 36px;border:0;border-radius:8px;background:var(--btn);color:#2a1205;cursor:pointer}
#ov button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.help{font-size:13px;color:var(--sub)}
</style>
</head>

var state='idle',score=0,best=0,lives=3,bricks=[],ball,pad,keys={},last=0,waitLeft=0;

function build(){bricks=[];for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)
  bricks.push({x:PAD+c*(BW+GAP),y:TOP+r*(BH+GAP),r:r,k:(r+c)%5})}
function resetBall(){pad.x=W/2;ball={x:W/2,y:pad.y-12,vx:0,vy:0,r:12}}
function hud(){document.getElementById('score').textContent='점수 '+score;
  document.getElementById('lv').textContent=level+'단계';
  document.getElementById('lives').textContent='목숨 '+lives}
function launch(){var a=Math.random()*0.7-0.35;ball.vx=Math.sin(a)*sp();ball.vy=-Math.cos(a)*sp()}
function start(){
  score=0;lives=3;level=1;pad={x:W/2,w:92,h:12,y:H-42};build();resetBall();hud();
  ov.className='hide';state='wait';waitLeft=0.6}
function finish(won){
  state='end';if(score>best)best=score;
  T.textContent='게임 끝';
  S.innerHTML=(won?'벽돌을 모두 깼어요!<br>':'')+'점수 '+score+'<br>최고 점수 '+best;
  B.textContent='다시 하기';ov.className=''}
B.addEventListener('click',start);

function setX(px){pad&&(pad.x=Math.max(pad.w/2,Math.min(W-pad.w/2,px)))}
cv.addEventListener('pointermove',function(e){var b=cv.getBoundingClientRect();setX((e.clientX-b.left)*W/b.width)});
cv.addEventListener('pointerdown',function(e){var b=cv.getBoundingClientRect();setX((e.clientX-b.left)*W/b.width)});
addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=1;e.preventDefault()}});
addEventListener('keyup',function(e){keys[e.key]=0});

function update(dt){
  if(state==='idle'||state==='end')return;
  if(keys.ArrowLeft)setX(pad.x-540*dt);
  if(keys.ArrowRight)setX(pad.x+540*dt);
  if(state==='wait'){ball.x=pad.x;ball.y=pad.y-ball.r;
    waitLeft-=dt;if(waitLeft<=0){launch();state='play'}return}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
  if(ball.vy>0&&ball.y+ball.r>=pad.y&&ball.y+ball.r<=pad.y+pad.h+10&&Math.abs(ball.x-pad.x)<=pad.w/2+ball.r){
    var k=Math.max(-1,Math.min(1,(ball.x-pad.x)/(pad.w/2))),a=k*1.05;
    ball.vx=Math.sin(a)*sp();ball.vy=-Math.cos(a)*sp();ball.y=pad.y-ball.r}
  for(var i=0;i<bricks.length;i++){var b=bricks[i];
    var dx=ball.x-(b.x+BW/2),dy=ball.y-(b.y+BH/2);
    var ox=BW/2+ball.r-Math.abs(dx),oy=BH/2+ball.r-Math.abs(dy);
    if(ox>0&&oy>0){
      if(ox<oy)ball.vx=dx>0?Math.abs(ball.vx):-Math.abs(ball.vx);
      else ball.vy=dy>0?Math.abs(ball.vy):-Math.abs(ball.vy);
      bricks.splice(i,1);score+=10;hud();break}}
  if(!bricks.length){
    if(level===1){level=2;build();resetBall();hud();state='wait';waitLeft=1}else finish(true);
    return}
  if(ball.y>H+ball.r){lives--;hud();
    if(lives<=0)finish(false);else{resetBall();state='wait';waitLeft=1}}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
  ctx.clearRect(0,0,W,H);
  bricks.forEach(function(b){ctx.fillStyle=COLORS[b.k];rr(b.x,b.y,BW,BH,5);ctx.fill();
    var m=SPR[b.k];if(m.complete&&m.naturalWidth){var f=Math.min((BH-4)/m.naturalHeight,(BW-4)/m.naturalWidth),w=m.naturalWidth*f,h=m.naturalHeight*f;
      ctx.drawImage(m,b.x+(BW-w)/2,b.y+(BH-h)/2,w,h)}});
  ctx.fillStyle='#e3f0f4';rr(pad.x-pad.w/2,pad.y,pad.w,pad.h,6);ctx.fill();
  if(img.complete&&img.naturalWidth){var ih=36,iw=ih*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,ball.x-iw/2,ball.y-ih/2-3,iw,ih)}
  else{ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}
}
function loop(t){var dt=Math.min((t-last)/1000,0.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
pad={x:W/2,w:92,h:12,y:H-42};build();resetBall();
requestAnimationFrame(function(t){last=t;loop(t)});
})();
</script>
